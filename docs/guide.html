<!doctype html>
<html lang="en" data-theme="light" data-brand="indigo" data-style="standard">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Developer Guide — Custom Design System</title>
  <link rel="stylesheet" href="../src/whitelabel/tokens.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-sans); background: var(--bg-app); color: var(--fg-default); font-size: var(--text-sm); line-height: 1.6; }

    /* ── Shell ────────────────────────────────────────────────────────── */
    .shell { display: grid; grid-template-columns: 256px 1fr; min-height: 100vh; }

    /* ── Sidebar nav ─────────────────────────────────────────────────── */
    .nav {
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
      background: var(--bg-canvas); border-right: 1px solid var(--border-subtle);
      padding: var(--space-6) var(--space-4);
      display: flex; flex-direction: column; gap: var(--space-1);
    }
    .nav-mark {
      display: flex; align-items: center; gap: var(--space-3);
      padding: 0 var(--space-2) var(--space-5);
      border-bottom: 1px solid var(--border-subtle); margin-bottom: var(--space-4);
    }
    .nav-mark-tile {
      width: 32px; height: 32px; border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 700; font-size: var(--text-sm); flex-shrink: 0;
    }
    .nav-mark-label { font-weight: 600; font-size: var(--text-sm); color: var(--fg-strong); line-height: 1.2; }
    .nav-mark-sub { font-size: var(--text-xs); color: var(--fg-muted); }

    .nav-group { margin-bottom: var(--space-4); }
    .nav-group-title {
      font-size: 10px; font-weight: 600; color: var(--fg-subtle); letter-spacing: 0.08em;
      text-transform: uppercase; padding: 0 var(--space-2); margin-bottom: var(--space-2);
    }
    .nav-link {
      display: flex; align-items: center; gap: var(--space-2);
      padding: var(--space-2) var(--space-2); border-radius: var(--radius-sm);
      font-size: var(--text-sm); color: var(--fg-muted); text-decoration: none;
      transition: background var(--dur-fast), color var(--dur-fast);
    }
    .nav-link:hover { background: var(--bg-muted); color: var(--fg-default); }
    .nav-link.active { background: var(--bg-brand-subtle); color: var(--fg-brand); font-weight: 500; }
    .nav-bottom {
      margin-top: auto; padding-top: var(--space-4);
      border-top: 1px solid var(--border-subtle);
    }

    /* ── Main content ─────────────────────────────────────────────────── */
    .main { min-width: 0; }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg-canvas); border-bottom: 1px solid var(--border-subtle);
      padding: var(--space-3) var(--space-7);
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar-breadcrumb { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); color: var(--fg-muted); }
    .topbar-breadcrumb span { color: var(--fg-default); font-weight: 500; }
    .topbar-actions { display: flex; align-items: center; gap: var(--space-3); }
    .theme-toggle {
      display: flex; align-items: center; gap: var(--space-1);
      padding: var(--space-1); background: var(--bg-muted); border-radius: var(--radius-md);
    }
    .theme-btn {
      padding: var(--space-1) var(--space-3); border: none; cursor: pointer;
      border-radius: var(--radius-sm); font-size: var(--text-xs); font-weight: 500;
      background: transparent; color: var(--fg-muted); transition: all var(--dur-fast);
    }
    .theme-btn.active { background: var(--bg-surface); color: var(--fg-default); box-shadow: var(--shadow-xs); }

    .content { padding: var(--space-8) var(--space-7); max-width: 800px; }

    /* ── Sections ─────────────────────────────────────────────────────── */
    .section { margin-bottom: var(--space-10); scroll-margin-top: 64px; }
    .section-label {
      font-size: 10px; font-weight: 600; color: var(--fg-brand); letter-spacing: 0.08em;
      text-transform: uppercase; margin-bottom: var(--space-2);
    }
    .section-title { font-size: var(--text-3xl); font-weight: 700; color: var(--fg-strong); line-height: 1.15; margin-bottom: var(--space-3); }
    .section-lead { font-size: var(--text-base); color: var(--fg-muted); max-width: 560px; line-height: 1.6; margin-bottom: var(--space-6); }

    h2 { font-size: var(--text-xl); font-weight: 600; color: var(--fg-strong); margin: var(--space-7) 0 var(--space-3); }
    h3 { font-size: var(--text-base); font-weight: 600; color: var(--fg-strong); margin: var(--space-5) 0 var(--space-2); }
    p { color: var(--fg-default); margin-bottom: var(--space-3); line-height: 1.6; }

    /* ── Steps ────────────────────────────────────────────────────────── */
    .steps { display: flex; flex-direction: column; gap: var(--space-5); margin-bottom: var(--space-7); }
    .step { display: flex; gap: var(--space-5); }
    .step-num {
      flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%;
      background: var(--bg-brand); color: var(--fg-on-brand);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: var(--text-sm);
    }
    .step-body { flex: 1; padding-top: 6px; }
    .step-title { font-weight: 600; color: var(--fg-strong); margin-bottom: var(--space-2); font-size: var(--text-base); }
    .step-desc { color: var(--fg-muted); font-size: var(--text-sm); line-height: 1.6; margin-bottom: var(--space-3); }

    /* ── Code blocks ─────────────────────────────────────────────────── */
    .code-wrap { position: relative; margin-bottom: var(--space-4); }
    .code-block {
      background: var(--bg-muted); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); padding: var(--space-4);
      font-family: var(--font-mono); font-size: 12px; line-height: 1.6;
      color: var(--fg-default); overflow-x: auto; white-space: pre;
    }
    .code-copy {
      position: absolute; top: var(--space-3); right: var(--space-3);
      padding: var(--space-1) var(--space-3); background: var(--bg-surface);
      border: 1px solid var(--border-default); border-radius: var(--radius-sm);
      font-size: 11px; font-weight: 500; color: var(--fg-muted); cursor: pointer;
      transition: all var(--dur-fast);
    }
    .code-copy:hover { color: var(--fg-default); border-color: var(--border-focus); }

    /* ── Terminal simulator ──────────────────────────────────────────── */
    .terminal {
      background: #0f1117; border-radius: var(--radius-lg); overflow: hidden;
      margin-bottom: var(--space-5); box-shadow: var(--shadow-md);
    }
    .terminal-bar {
      background: #1c1f26; padding: var(--space-3) var(--space-4);
      display: flex; align-items: center; gap: var(--space-2);
    }
    .terminal-dot { width: 12px; height: 12px; border-radius: 50%; }
    .terminal-body { padding: var(--space-4) var(--space-5); font-family: var(--font-mono); font-size: 12.5px; line-height: 1.8; }
    .t-prompt { color: #6ee7b7; }
    .t-cmd { color: #f8fafc; }
    .t-q { color: #93c5fd; }
    .t-ans { color: #fbbf24; }
    .t-out { color: #94a3b8; }
    .t-ok { color: #6ee7b7; }
    .t-dim { color: #475569; }

    /* ── Config cards ────────────────────────────────────────────────── */
    .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-7); }
    .config-card {
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg); padding: var(--space-5);
    }
    .config-card-title { font-weight: 600; color: var(--fg-strong); margin-bottom: var(--space-1); font-size: var(--text-sm); display: flex; align-items: center; gap: var(--space-2); }
    .config-card-desc { font-size: var(--text-xs); color: var(--fg-muted); margin-bottom: var(--space-4); line-height: 1.5; }

    /* ── Brand swatches ─────────────────────────────────────────────── */
    .swatches { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .swatch { width: 28px; height: 28px; border-radius: var(--radius-sm); cursor: default; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }

    /* ── Style preset chips ──────────────────────────────────────────── */
    .preset-list { display: flex; flex-direction: column; gap: var(--space-2); }
    .preset-row { display: flex; align-items: baseline; gap: var(--space-2); font-size: var(--text-xs); }
    .preset-name { font-weight: 600; color: var(--fg-default); min-width: 80px; }
    .preset-font { color: var(--fg-muted); min-width: 100px; }
    .preset-use { color: var(--fg-subtle); }

    /* ── Size comparison ─────────────────────────────────────────────── */
    .size-row { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-2); }
    .size-label { font-size: var(--text-xs); color: var(--fg-muted); min-width: 24px; font-family: var(--font-mono); }

    /* ── Rules list ──────────────────────────────────────────────────── */
    .rule-list { display: flex; flex-direction: column; gap: var(--space-4); }
    .rule { display: flex; gap: var(--space-4); padding: var(--space-4); background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); }
    .rule-n { flex-shrink: 0; width: 28px; height: 28px; border-radius: var(--radius-sm); background: var(--bg-brand-subtle); color: var(--fg-brand); font-weight: 700; font-size: var(--text-xs); display: flex; align-items: center; justify-content: center; }
    .rule-body {}
    .rule-title { font-weight: 600; color: var(--fg-strong); font-size: var(--text-sm); margin-bottom: var(--space-1); }
    .rule-desc { font-size: var(--text-xs); color: var(--fg-muted); line-height: 1.5; }
    .rule-code { margin-top: var(--space-2); font-family: var(--font-mono); font-size: 11px; background: var(--bg-muted); padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); color: var(--fg-default); }
    .good { color: var(--fg-success); } .bad { color: var(--fg-danger); }

    /* ── Component table ─────────────────────────────────────────────── */
    .comp-table { width: 100%; border-collapse: collapse; font-size: var(--text-xs); margin-bottom: var(--space-6); }
    .comp-table th { text-align: left; padding: var(--space-2) var(--space-3); font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-subtle); border-bottom: 1px solid var(--border-subtle); }
    .comp-table td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border-subtle); color: var(--fg-default); vertical-align: top; line-height: 1.5; }
    .comp-table tr:last-child td { border-bottom: none; }
    .comp-table tr:hover td { background: var(--bg-muted); }
    .file-tag { font-family: var(--font-mono); font-size: 11px; color: var(--fg-brand); background: var(--bg-brand-subtle); padding: 1px 6px; border-radius: var(--radius-sm); white-space: nowrap; }
    .comp-names { color: var(--fg-muted); }

    /* ── Prompt cards ────────────────────────────────────────────────── */
    .prompt-card {
      border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
      overflow: hidden; margin-bottom: var(--space-4);
    }
    .prompt-header {
      padding: var(--space-3) var(--space-4); background: var(--bg-muted);
      border-bottom: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between;
    }
    .prompt-label { font-size: var(--text-xs); font-weight: 600; color: var(--fg-strong); }
    .prompt-body {
      padding: var(--space-4); font-size: var(--text-sm); color: var(--fg-default);
      line-height: 1.6; background: var(--bg-surface); font-family: var(--font-mono);
      font-size: 12px; white-space: pre-wrap;
    }

    /* ── Call-out boxes ──────────────────────────────────────────────── */
    .callout {
      padding: var(--space-4) var(--space-5); border-radius: var(--radius-md);
      border-left: 3px solid var(--border-brand); background: var(--bg-brand-subtle);
      font-size: var(--text-sm); color: var(--fg-default); margin-bottom: var(--space-5);
    }
    .callout strong { color: var(--fg-strong); }

    .divider { border: none; border-top: 1px solid var(--border-subtle); margin: var(--space-8) 0; }

    code { font-family: var(--font-mono); font-size: 11px; background: var(--bg-muted); padding: 1px 5px; border-radius: var(--radius-sm); color: var(--fg-default); }

    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .nav { display: none; }
      .config-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="../src/whitelabel/Primitives.jsx"></script>
  <script type="text/babel" src="../src/whitelabel/Overlays.jsx"></script>
  <script type="text/babel" src="../src/whitelabel/Small.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { Badge, Button, Alert, Toaster } = window;

    const NAV = [
      { group: 'Start here', links: [
        { href: '#overview',   label: 'Overview',        icon: 'layout-dashboard' },
        { href: '#setup',      label: 'Setup wizard',    icon: 'terminal' },
        { href: '#config',     label: 'Configuration',   icon: 'sliders-horizontal' },
      ]},
      { group: 'Building', links: [
        { href: '#claude',     label: 'Claude Code',     icon: 'bot' },
        { href: '#components', label: 'Components',      icon: 'puzzle' },
        { href: '#rules',      label: 'Rules',           icon: 'shield-check' },
      ]},
      { group: 'Reference', links: [
        { href: '../configure/index.html', label: 'Configurator',    icon: 'palette',  external: true },
        { href: 'index.html',              label: 'Component docs',  icon: 'book-open', external: true },
        { href: '../Whitelabel UI Kit.html', label: 'UI Kit showcase', icon: 'layers',  external: true },
      ]},
    ];

    const BRANDS = [
      { name: 'indigo',  c: '#6366f1' }, { name: 'violet', c: '#8b5cf6' },
      { name: 'fuchsia', c: '#d946ef' }, { name: 'pink',   c: '#ec4899' },
      { name: 'rose',    c: '#f43f5e' }, { name: 'red',    c: '#ef4444' },
      { name: 'orange',  c: '#f97316' }, { name: 'amber',  c: '#f59e0b' },
      { name: 'emerald', c: '#10b981' }, { name: 'teal',   c: '#14b8a6' },
      { name: 'cyan',    c: '#06b6d4' }, { name: 'blue',   c: '#3b82f6' },
    ];

    const COMPONENTS = [
      { file: 'Primitives.jsx', exports: 'Icon, Button, IconButton, Input, Textarea, Select, Checkbox, Radio, RadioGroup, Switch, Badge, Avatar, AvatarGroup, Card, Spinner, Alert, Tooltip, Progress, Tabs, Breadcrumbs, Kbd, Typography' },
      { file: 'Overlays.jsx',   exports: 'Dialog, Sheet, Popover, DropdownMenu, Toaster, toast' },
      { file: 'Display.jsx',    exports: 'Table, TableHead, TableBody, TableRow, TableCell, Pagination, Skeleton, Separator, Empty' },
      { file: 'Sidebar.jsx',    exports: 'Sidebar (collapsible app nav with sections + sub-items)' },
      { file: 'Small.jsx',      exports: 'Label, Field, ButtonGroup, InputGroup, Toggle, AspectRatio, Collapsible, ScrollArea, Item, AlertDialog, Direction, DirectionToggle, useDirection' },
      { file: 'Medium.jsx',     exports: 'HoverCard, ContextMenu, InputOTP, Resizable, Drawer, Menubar' },
      { file: 'MoreInputs.jsx', exports: 'Slider, ToggleGroup, Combobox, Accordion' },
      { file: 'Complex.jsx',    exports: 'Calendar, DatePicker, Command, Carousel, Chart, DataTable, NavigationMenu' },
      { file: 'Gaps.jsx',       exports: 'FileUpload, MultiSelect, Typeahead, DateRangePicker, FormErrorSummary' },
      { file: 'Gaps2.jsx',      exports: 'AsyncField, AvatarUpload, CsvImport' },
      { file: 'AppShell.jsx',   exports: 'AppShell (full-page app layout)' },
      { file: 'Patterns.jsx',   exports: 'Reusable layout patterns' },
      { file: 'SaaS.jsx',       exports: 'SaaS-specific patterns (billing, pricing, team)' },
    ];

    const RULES = [
      {
        title: 'Never inline raw values',
        desc: 'No hex colors, no raw px for spacing or radius, no raw ms durations. Every visual value must come from a token.',
        good: 'color: var(--fg-default);   padding: var(--space-4);',
        bad:  'color: #1a1a1a;             padding: 16px;',
      },
      {
        title: 'Consume the semantic layer, not the scale',
        desc: 'Use the semantic alias, never the raw primitive scale. Only tokens.css itself should reference primitive scales.',
        good: 'var(--fg-muted)   var(--bg-brand)   var(--border-subtle)',
        bad:  'var(--neutral-500)   var(--indigo-600)   var(--neutral-200)',
      },
      {
        title: 'One brand, one accent',
        desc: 'A second color must come from the closed status taxonomy. Never introduce a second hue alongside brand.',
        good: 'success / warning / danger / info',
        bad:  'A second brand hue for decoration',
      },
      {
        title: 'Variant maps to intent',
        desc: 'One primary action per surface. Danger always confirms. Ghost for toolbars.',
        good: 'variant="primary"  (submit, save)   variant="danger"  (destructive + confirm)',
        bad:  'Two primary buttons on the same surface',
      },
      {
        title: 'Match size to context',
        desc: 'xs/sm for tables and toolbars. md for forms and page actions (default). lg for landing CTAs and empty states.',
        good: '<Button size="sm"> in table rows    <Button size="lg"> in empty states',
        bad:  'Using size="lg" for every button',
      },
      {
        title: 'Status taxonomy is closed',
        desc: 'success, warning, danger, info — never invent a fifth status. Badge, Alert, and Progress all share this set.',
        good: 'variant="success"  variant="warning"  variant="danger"  variant="info"',
        bad:  'variant="purple"  variant="neutral-special"',
      },
      {
        title: 'Light and dark are equal citizens',
        desc: 'Test every screen in both themes. Components inherit dark mode for free via tokens. Any custom CSS you write must too.',
        good: 'color: var(--fg-default);  /* works in both themes */',
        bad:  'color: #000;  /* invisible in dark mode */',
      },
      {
        title: 'Accessibility floor',
        desc: 'AA contrast (4.5:1) on text. Touch targets ≥ 32px (size="md" default). icon-only buttons require ariaLabel. Status communicated by color must also carry an icon or text.',
        good: '<IconButton ariaLabel="Delete item" icon="trash" />',
        bad:  '<IconButton icon="trash" />  /* screen readers can\'t describe this */',
      },
      {
        title: 'Form fields need labels',
        desc: 'Always set label and either placeholder or hint. Errors use error + hint together. Required fields get required.',
        good: '<Input label="Email" placeholder="you@example.com" required />',
        bad:  '<input type="email" />  /* unlabelled, inaccessible */',
      },
      {
        title: 'Respect the spacing rhythm',
        desc: 'The grid is 4-point. Most layouts use --space-3/5/7/8 (8/16/24/32). Never break the grid with arbitrary values.',
        good: 'gap: var(--space-4);  padding: var(--space-5);',
        bad:  'gap: 13px;  padding: 18px;',
      },
    ];

    const PROMPTS = [
      {
        label: 'New page from scratch',
        text: `Build a user management page for this project.

Use the project config from CLAUDE.md:
- Load src/whitelabel/Primitives.jsx, Overlays.jsx, Display.jsx, Sidebar.jsx
- Sidebar with "Users", "Roles", "Activity" nav items
- DataTable with columns: Name, Email, Role (Badge), Status (Badge), Last active, Actions
- "Invite member" primary button in the page header
- Delete action opens a confirmation Dialog (variant="danger")
- Toast feedback on every action

Only use components from src/whitelabel/. Follow all rules in CLAUDE.md.`,
      },
      {
        label: 'Add a feature to an existing screen',
        text: `Add a bulk-action toolbar to the existing DataTable in index.html.

When one or more rows are selected:
- Show a toolbar above the table: "X selected · [Export CSV] [Change role] [Suspend] [Delete]"
- Delete shows an AlertDialog confirming how many will be deleted
- All actions show a toast on completion

Use only design system components. Follow the component size and variant rules in CLAUDE.md.`,
      },
      {
        label: 'Build a settings page',
        text: `Build a Settings page for this project.

Sections (use Tabs from Primitives.jsx):
1. Profile — avatar upload, name, email, timezone
2. Notifications — toggle groups for email/slack/in-app per event type
3. Security — password change form, active sessions list
4. Billing — plan badge, usage bar (Progress), invoice table

Load: Primitives.jsx, Small.jsx, Complex.jsx, MoreInputs.jsx, Overlays.jsx
Follow the project config in CLAUDE.md. Sentence case all labels.`,
      },
    ];

    function CodeBlock({ code, lang }) {
      const [copied, setCopied] = useState(false);
      const copy = () => {
        navigator.clipboard.writeText(code);
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      };
      return (
        <div className="code-wrap">
          <pre className="code-block">{code}</pre>
          <button className="code-copy" onClick={copy}>{copied ? 'Copied' : 'Copy'}</button>
        </div>
      );
    }

    function PromptCard({ label, text }) {
      const [copied, setCopied] = useState(false);
      const copy = () => {
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      };
      return (
        <div className="prompt-card">
          <div className="prompt-header">
            <span className="prompt-label">{label}</span>
            <button className="code-copy" style={{position:'static'}} onClick={copy}>{copied ? 'Copied' : 'Copy prompt'}</button>
          </div>
          <div className="prompt-body">{text}</div>
        </div>
      );
    }

    function Guide() {
      const [theme, setTheme] = useState('light');
      const [active, setActive] = useState('overview');
      const Icon = window.Icon;

      useEffect(() => {
        document.documentElement.dataset.theme = theme;
      }, [theme]);

      useEffect(() => {
        const observer = new IntersectionObserver(
          entries => {
            entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
          },
          { rootMargin: '-20% 0px -70% 0px' }
